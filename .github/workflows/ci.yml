name: OpsLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: opslens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Initialize bootstrap configuration
        run: terraform -chdir=terraform/bootstrap init -backend=false

      - name: Validate bootstrap configuration
        run: terraform -chdir=terraform/bootstrap validate

      - name: Initialize infrastructure configuration
        run: terraform -chdir=terraform/infrastructure init -backend=false

      - name: Validate infrastructure configuration
        run: terraform -chdir=terraform/infrastructure validate

  kubernetes:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Validate Kubernetes manifests offline
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            PyYAML==6.0.2

          manifests=(
            kubernetes/base/gotenberg/namespace.yaml
            kubernetes/base/gotenberg/deployment.yaml
            kubernetes/base/gotenberg/service.yaml
            kubernetes/engines/chromium.yaml
            kubernetes/engines/libreoffice.yaml
            kubernetes/gateway/envoy.yaml
            kubernetes/observability/namespace.yaml
            kubernetes/observability/storageclass-gp3.yaml
            kubernetes/observability/dashboard-configmap.yaml
            kubernetes/observability/logs-dashboard-configmap.yaml
            kubernetes/validation/webhook-receiver.yaml
            kubernetes/gitops/opslens-application.yaml
          )

          python3 - "${manifests[@]}" <<'PYVALIDATE'
          import sys
          from pathlib import Path

          import yaml

          failed = False

          for filename in sys.argv[1:]:
              path = Path(filename)
              print(f"Validating {path}")

              try:
                  documents = list(yaml.safe_load_all(path.read_text()))
              except Exception as exc:
                  print(f"ERROR: invalid YAML: {path}: {exc}")
                  failed = True
                  continue

              resources = [doc for doc in documents if doc is not None]

              if not resources:
                  print(f"ERROR: no YAML documents found: {path}")
                  failed = True
                  continue

              for index, resource in enumerate(resources, start=1):
                  if not isinstance(resource, dict):
                      print(
                          f"ERROR: document {index} in {path} "
                          "is not a mapping"
                      )
                      failed = True
                      continue

                  for required in ("apiVersion", "kind", "metadata"):
                      if required not in resource:
                          print(
                              f"ERROR: document {index} in {path} "
                              f"is missing {required}"
                          )
                          failed = True

                  metadata = resource.get("metadata", {})

                  if isinstance(metadata, dict):
                      if not metadata.get("name"):
                          print(
                              f"ERROR: document {index} in {path} "
                              "is missing metadata.name"
                          )
                          failed = True

          if failed:
              raise SystemExit(1)

          print("Offline Kubernetes YAML validation passed.")
          PYVALIDATE

          echo
          echo "Rendering active GitOps application with Kustomize..."

          kubectl kustomize kubernetes \
            > /tmp/opslens-gitops-rendered.yaml

          test -s /tmp/opslens-gitops-rendered.yaml

          echo "Kustomize render passed."
          echo
          echo "Rendered resources:"

          grep '^kind:' \
            /tmp/opslens-gitops-rendered.yaml

      - name: Validate Grafana dashboard JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 -m json.tool \
            kubernetes/observability/dashboards/opslens-overview.json \
            >/dev/null

          python3 -m json.tool \
            kubernetes/observability/dashboards/opslens-logs.json \
            >/dev/null

  scripts:
    name: Script validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(
            find scripts \
              -type f \
              -name '*.sh' \
              -print0
          )

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check prohibited generated or sensitive files
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(
            git ls-files \
              | grep -E \
                '(^|/)\.terraform/|\.tfstate($|\.)|\.tfplan$|terraform\.tfvars$' \
              || true
          )"

          if [[ -n "$bad_files" ]]; then
            echo "ERROR: prohibited files are tracked:"
            echo "$bad_files"
            exit 1
          fi

          echo "Repository hygiene check passed."
