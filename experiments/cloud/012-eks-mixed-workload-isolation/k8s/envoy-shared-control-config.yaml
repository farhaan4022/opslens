apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: opslens
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: application
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080

          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: opslens_gateway

                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                    route_config:
                      name: opslens_routes

                      virtual_hosts:
                        - name: gotenberg
                          domains:
                            - "*"

                          routes:
                            - match:
                                path: /healthz
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok\n"

                            - match:
                                prefix: /forms/chromium/
                              route:
                                cluster: shared
                                timeout: 60s

                            - match:
                                prefix: /forms/libreoffice/
                              route:
                                cluster: shared
                                timeout: 60s

                            - match:
                                path: /health
                              route:
                                cluster: shared
                                timeout: 5s

                            - match:
                                path: /version
                              route:
                                cluster: shared
                                timeout: 5s

                            - match:
                                prefix: /prometheus/metrics
                              route:
                                cluster: shared
                                timeout: 5s

                            - match:
                                prefix: /
                              direct_response:
                                status: 404
                                body:
                                  inline_string: "route not found\n"

                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: shared
          type: STRICT_DNS
          connect_timeout: 2s
          lb_policy: ROUND_ROBIN

          load_assignment:
            cluster_name: shared
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: gotenberg-shared-control.opslens.svc.cluster.local
                          port_value: 3000

    admin:
      access_log_path: /tmp/envoy-admin.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
