apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg-shared-control
  namespace: opslens
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: gotenberg-shared-control

  template:
    metadata:
      labels:
        app: gotenberg-shared-control
        experiment: mixed-workload-control

    spec:
      containers:
        - name: gotenberg
          image: 743502211832.dkr.ecr.ap-south-1.amazonaws.com/opslens/gotenberg@sha256:3fdee07e0dcd5005c3db4d81d1600d081fc6fb424da87e409e1c1f9624a249b8

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg-shared-control
  namespace: opslens
spec:
  type: ClusterIP

  selector:
    app: gotenberg-shared-control

  ports:
    - name: http
      port: 3000
      targetPort: http
