apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gotenberg-chromium
  namespace: opslens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gotenberg-chromium

  minReplicas: 1
  maxReplicas: 2

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
