apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue-scaler
  namespace: opslens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: queue-scaler
  namespace: opslens
rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: queue-scaler
  namespace: opslens
subjects:
  - kind: ServiceAccount
    name: queue-scaler
    namespace: opslens
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: queue-scaler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-scaler-code
  namespace: opslens
data:
  scaler.py: |
    import json
    import os
    import re
    import ssl
    import time
    import urllib.request
    from datetime import datetime, timezone

    NAMESPACE = os.getenv("NAMESPACE", "opslens")
    POD_NAME = os.getenv("POD_NAME", "unknown")

    POLL_SECONDS = float(os.getenv("POLL_SECONDS", "1"))
    QUEUE_THRESHOLD = float(os.getenv("QUEUE_THRESHOLD", "2"))
    REQUIRED_SAMPLES = int(os.getenv("REQUIRED_SAMPLES", "2"))

    MIN_REPLICAS = int(os.getenv("MIN_REPLICAS", "1"))
    MAX_REPLICAS = int(os.getenv("MAX_REPLICAS", "2"))

    SCALE_DOWN_ZERO_SECONDS = float(
        os.getenv("SCALE_DOWN_ZERO_SECONDS", "120")
    )

    API_HOST = os.environ["KUBERNETES_SERVICE_HOST"]
    API_PORT = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")

    TOKEN_PATH = (
        "/var/run/secrets/kubernetes.io/serviceaccount/token"
    )

    CA_PATH = (
        "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    )

    with open(TOKEN_PATH) as f:
        TOKEN = f.read().strip()

    SSL_CONTEXT = ssl.create_default_context(cafile=CA_PATH)

    ENGINES = {
        "chromium": {
            "deployment": "gotenberg-chromium",
            "url": "http://gotenberg-chromium:3000/prometheus/metrics",
            "metric": "gotenberg_chromium_requests_queue_size",
        },
        "libreoffice": {
            "deployment": "gotenberg-libreoffice",
            "url": "http://gotenberg-libreoffice:3000/prometheus/metrics",
            "metric": "gotenberg_libreoffice_requests_queue_size",
        },
    }

    state = {
        name: {
            "high_samples": 0,
            "zero_since": None,
        }
        for name in ENGINES
    }


    def log(event, **fields):
        record = {
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "timestamp_ms": time.time_ns() // 1_000_000,
            "event": event,
            "controller": POD_NAME,
            **fields,
        }

        print(json.dumps(record), flush=True)


    def kube_request(method, path, body=None):
        url = f"https://{API_HOST}:{API_PORT}{path}"

        data = None

        headers = {
            "Authorization": f"Bearer {TOKEN}",
        }

        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/merge-patch+json"

        request = urllib.request.Request(
            url,
            data=data,
            headers=headers,
            method=method,
        )

        with urllib.request.urlopen(
            request,
            context=SSL_CONTEXT,
            timeout=2,
        ) as response:
            return json.loads(response.read())


    def scale_path(deployment):
        return (
            f"/apis/apps/v1/namespaces/{NAMESPACE}"
            f"/deployments/{deployment}/scale"
        )


    def current_replicas(deployment):
        response = kube_request(
            "GET",
            scale_path(deployment),
        )

        return int(response["spec"]["replicas"])


    def set_replicas(deployment, replicas):
        kube_request(
            "PATCH",
            scale_path(deployment),
            {
                "spec": {
                    "replicas": replicas,
                }
            },
        )


    def queue_depth(url, metric):
        request = urllib.request.Request(
            url,
            headers={
                "Connection": "close",
            },
        )

        with urllib.request.urlopen(
            request,
            timeout=1,
        ) as response:
            text = response.read().decode()

        pattern = re.compile(
            rf"^{re.escape(metric)}"
            r"(?:\{[^}]*\})?"
            r"\s+([0-9eE+.\-]+)$",
            re.MULTILINE,
        )

        match = pattern.search(text)

        if not match:
            raise RuntimeError(
                f"metric not found: {metric}"
            )

        return float(match.group(1))


    log(
        "controller_started",
        poll_seconds=POLL_SECONDS,
        threshold=QUEUE_THRESHOLD,
        required_samples=REQUIRED_SAMPLES,
        min_replicas=MIN_REPLICAS,
        max_replicas=MAX_REPLICAS,
        scale_down_zero_seconds=SCALE_DOWN_ZERO_SECONDS,
    )


    while True:
        loop_started = time.monotonic()

        for engine, cfg in ENGINES.items():
            try:
                queue = queue_depth(
                    cfg["url"],
                    cfg["metric"],
                )

                replicas = current_replicas(
                    cfg["deployment"]
                )

                engine_state = state[engine]
                now = time.monotonic()

                if queue >= QUEUE_THRESHOLD:
                    engine_state["high_samples"] += 1
                else:
                    engine_state["high_samples"] = 0

                if queue > 0:
                    engine_state["zero_since"] = None
                elif engine_state["zero_since"] is None:
                    engine_state["zero_since"] = now

                log(
                    "sample",
                    engine=engine,
                    queue=queue,
                    replicas=replicas,
                    high_samples=engine_state["high_samples"],
                )

                if (
                    replicas < MAX_REPLICAS
                    and engine_state["high_samples"]
                    >= REQUIRED_SAMPLES
                ):
                    set_replicas(
                        cfg["deployment"],
                        MAX_REPLICAS,
                    )

                    log(
                        "scale_up",
                        engine=engine,
                        queue=queue,
                        old_replicas=replicas,
                        new_replicas=MAX_REPLICAS,
                        reason="queue_threshold",
                    )

                    engine_state["high_samples"] = 0
                    engine_state["zero_since"] = None

                elif (
                    replicas > MIN_REPLICAS
                    and engine_state["zero_since"] is not None
                    and (
                        now - engine_state["zero_since"]
                        >= SCALE_DOWN_ZERO_SECONDS
                    )
                ):
                    set_replicas(
                        cfg["deployment"],
                        MIN_REPLICAS,
                    )

                    log(
                        "scale_down",
                        engine=engine,
                        queue=queue,
                        old_replicas=replicas,
                        new_replicas=MIN_REPLICAS,
                        reason="sustained_zero_queue",
                    )

                    engine_state["zero_since"] = now

            except Exception as exc:
                log(
                    "error",
                    engine=engine,
                    error=repr(exc),
                )

        elapsed = time.monotonic() - loop_started

        time.sleep(
            max(0.0, POLL_SECONDS - elapsed)
        )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-scaler
  namespace: opslens
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: queue-scaler

  template:
    metadata:
      labels:
        app: queue-scaler

    spec:
      serviceAccountName: queue-scaler

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: scaler
          image: python:3.12-slim

          command:
            - python
            - /app/scaler.py

          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: NAMESPACE
              value: opslens

            - name: POLL_SECONDS
              value: "1"

            - name: QUEUE_THRESHOLD
              value: "2"

            - name: REQUIRED_SAMPLES
              value: "2"

            - name: MIN_REPLICAS
              value: "1"

            - name: MAX_REPLICAS
              value: "2"

            - name: SCALE_DOWN_ZERO_SECONDS
              value: "120"

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: code
          configMap:
            name: queue-scaler-code

        - name: tmp
          emptyDir: {}
