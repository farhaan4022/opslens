apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: opslens
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: application
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080

          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: opslens_gateway

                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                    route_config:
                      name: opslens_routes

                      virtual_hosts:
                        - name: gotenberg
                          domains:
                            - "*"

                          routes:
                            - match:
                                path: /healthz
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok\n"

                            - match:
                                prefix: /forms/chromium/
                              route:
                                cluster: chromium
                                timeout: 60s

                            - match:
                                prefix: /forms/libreoffice/
                              route:
                                cluster: libreoffice
                                timeout: 60s

                            - match:
                                path: /health
                              route:
                                cluster: chromium
                                timeout: 5s

                            - match:
                                path: /version
                              route:
                                cluster: chromium
                                timeout: 5s

                            - match:
                                prefix: /prometheus/metrics
                              route:
                                cluster: chromium
                                timeout: 5s

                            - match:
                                prefix: /
                              direct_response:
                                status: 404
                                body:
                                  inline_string: "route not found\n"

                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: chromium
          type: STRICT_DNS
          connect_timeout: 2s
          lb_policy: ROUND_ROBIN

          load_assignment:
            cluster_name: chromium
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: gotenberg-chromium.opslens.svc.cluster.local
                          port_value: 3000

        - name: libreoffice
          type: STRICT_DNS
          connect_timeout: 2s
          lb_policy: ROUND_ROBIN

          load_assignment:
            cluster_name: libreoffice
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: gotenberg-libreoffice.opslens.svc.cluster.local
                          port_value: 3000

    admin:
      access_log_path: /tmp/envoy-admin.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: opslens
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: envoy-gateway

  template:
    metadata:
      labels:
        app: envoy-gateway
        component: gateway

    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1

          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID

      volumes:
        - name: config
          configMap:
            name: envoy-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: opslens
spec:
  type: ClusterIP

  selector:
    app: envoy-gateway

  ports:
    - name: http
      port: 8080
      targetPort: http
