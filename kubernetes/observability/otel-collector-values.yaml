mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: "0.161.0"

command:
  name: otelcol-k8s

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: false

  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false

config:
  exporters:
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp

  processors:
    resource/opslens:
      attributes:
        - key: k8s.cluster.name
          value: opslens-eks
          action: upsert

  receivers:
    file_log:
      include:
        - /var/log/pods/opslens_*/*/*.log

  service:
    pipelines:
      logs:
        receivers:
          - file_log
        processors:
          - memory_limiter
          - k8s_attributes
          - resource/opslens
          - batch
        exporters:
          - otlp_http/loki

      metrics: null
      traces: null

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 256Mi

ports:
  otlp:
    enabled: false

  otlp-http:
    enabled: false

  jaeger-compact:
    enabled: false

  jaeger-thrift:
    enabled: false

  jaeger-grpc:
    enabled: false

  zipkin:
    enabled: false
